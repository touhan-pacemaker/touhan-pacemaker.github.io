<svg xmlns="http://www.w3.org/2000/svg" viewBox="60 68 1480 832" role="img" aria-label="夜の30分のスマホ学習から、店頭で頼られる登録販売者へ（イラスト）">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e3f3ea"/>
      <stop offset="0.6" stop-color="#f6fbf8"/>
      <stop offset="1" stop-color="#fff0e2"/>
    </linearGradient>
    <linearGradient id="night" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a5a73"/>
      <stop offset="1" stop-color="#4f7590"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerUnits="userSpaceOnUse" markerWidth="30" markerHeight="30" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#f08a3c"/>
    </marker>
  </defs>

  <!-- 背景 -->
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1480" cy="120" r="150" fill="#ffe2c4" opacity=".6"/>
  <circle cx="120" cy="820" r="180" fill="#d3ecdf" opacity=".7"/>

  <!-- ===== 左: 夜の30分（今） ===== -->
  <g>
    <rect x="110" y="200" width="440" height="480" rx="44" fill="url(#night)"/>
    <!-- 月と星 -->
    <circle cx="470" cy="275" r="34" fill="#ffe7a1"/>
    <circle cx="486" cy="264" r="30" fill="#3d5e78"/>
    <g fill="#ffffff" opacity=".85">
      <circle cx="185" cy="255" r="4"/><circle cx="240" cy="300" r="3"/><circle cx="395" cy="240" r="3"/><circle cx="160" cy="330" r="2.5"/>
    </g>
    <text x="150" y="640" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, sans-serif" font-size="30" font-weight="700" fill="#ffffff">夜の30分</text>
    <!-- 紙のテキスト（紙派の人も自分を重ねられるように） -->
    <g transform="translate(136,470)">
      <path d="M0,14 Q32,0 64,12 L64,104 Q32,92 0,106 Z" fill="#ffffff"/>
      <path d="M64,12 Q96,0 128,14 L128,106 Q96,92 64,104 Z" fill="#eef5f1"/>
      <path d="M12,34 Q32,26 52,32 M12,52 Q32,44 52,50 M12,70 Q32,62 52,68" stroke="#c9ddd3" stroke-width="5" fill="none" stroke-linecap="round"/>
      <path d="M64,12 L64,104" stroke="#c9ddd3" stroke-width="3"/>
    </g>
    <!-- スマホ -->
    <rect x="240" y="315" width="168" height="290" rx="26" fill="#1d2b27"/>
    <rect x="250" y="327" width="148" height="266" rx="18" fill="#ffffff"/>
    <rect x="262" y="342" width="124" height="30" rx="8" fill="#0f7a5c"/>
    <text x="324" y="363" text-anchor="middle" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, sans-serif" font-size="17" font-weight="700" fill="#ffffff">今日の1問</text>
    <rect x="264" y="390" width="120" height="10" rx="5" fill="#d7e6df"/>
    <rect x="264" y="410" width="104" height="10" rx="5" fill="#d7e6df"/>
    <rect x="264" y="430" width="112" height="10" rx="5" fill="#d7e6df"/>
    <circle cx="295" cy="500" r="26" fill="none" stroke="#0f7a5c" stroke-width="7"/>
    <path d="M338,478 L382,522 M382,478 L338,522" stroke="#f08a3c" stroke-width="8" stroke-linecap="round"/>
    <rect x="270" y="548" width="108" height="24" rx="12" fill="#e6f2ec"/>
    <!-- マグカップ -->
    <rect x="430" y="540" width="62" height="70" rx="12" fill="#fff4ea"/>
    <path d="M492,556 q24,0 24,20 q0,20 -24,20" fill="none" stroke="#fff4ea" stroke-width="9"/>
    <path d="M448,520 q8,-14 0,-26 M470,520 q8,-14 0,-26" stroke="#ffffff" stroke-width="4" fill="none" stroke-linecap="round" opacity=".7"/>
  </g>


  <!-- ===== 右: 店頭（めざす姿） ===== -->
  <!-- 棚 -->
  <g>
    <rect x="700" y="130" width="820" height="640" rx="28" fill="#ffffff"/>
    <rect x="700" y="130" width="820" height="640" rx="28" fill="none" stroke="#d7e6df" stroke-width="6"/>
    <g fill="#d7e6df">
      <rect x="720" y="300" width="780" height="10" rx="5"/>
      <rect x="720" y="460" width="780" height="10" rx="5"/>
      <rect x="720" y="620" width="780" height="10" rx="5"/>
    </g>
    <!-- 棚の箱（ブランドなし） -->
    <g>
      <rect x="735" y="210" width="70" height="90" rx="8" fill="#bfe0d1"/>
      <rect x="815" y="230" width="60" height="70" rx="8" fill="#ffd9b8"/>
      <rect x="885" y="200" width="56" height="100" rx="8" fill="#cfe1f5"/>
      <rect x="1250" y="215" width="66" height="85" rx="8" fill="#ffd9b8"/>
      <rect x="1326" y="195" width="58" height="105" rx="8" fill="#bfe0d1"/>
      <rect x="1394" y="225" width="90" height="75" rx="8" fill="#f6e3a8"/>
      <rect x="735" y="380" width="88" height="80" rx="8" fill="#f6e3a8"/>
      <rect x="833" y="360" width="60" height="100" rx="8" fill="#cfe1f5"/>
      <rect x="1290" y="370" width="70" height="90" rx="8" fill="#bfe0d1"/>
      <rect x="1370" y="390" width="110" height="70" rx="8" fill="#ffd9b8"/>
      <rect x="735" y="540" width="64" height="80" rx="8" fill="#bfe0d1"/>
      <rect x="809" y="555" width="80" height="65" rx="8" fill="#ffd9b8"/>
      <rect x="1300" y="530" width="62" height="90" rx="8" fill="#cfe1f5"/>
      <rect x="1372" y="550" width="108" height="70" rx="8" fill="#f6e3a8"/>
    </g>
  </g>
  <!-- 床 -->
  <rect x="0" y="770" width="1600" height="130" fill="#e3f0e9"/>

  <!-- 矢印（今 → めざす姿） -->
  <path d="M575,430 C640,330 720,320 800,360" fill="none" stroke="#f08a3c" stroke-width="8" stroke-dasharray="4 18" stroke-linecap="round" marker-end="url(#arrow)"/>

  <!-- 人物（ドラッグストアのエプロン姿） -->
  <g>
    <!-- 後ろ髪 -->
    <ellipse cx="1080" cy="300" rx="108" ry="120" fill="#2e2622"/>
    <circle cx="1080" cy="176" r="46" fill="#2e2622"/>
    <!-- 首 -->
    <rect x="1058" y="378" width="44" height="46" rx="12" fill="#f3cfb4"/>
    <!-- 体: シャツ -->
    <path d="M955,480 Q965,428 1025,418 L1135,418 Q1195,428 1205,480 L1222,770 L938,770 Z" fill="#dcecf8" stroke="#b9d3e6" stroke-width="4"/>
    <!-- エプロン -->
    <path d="M985,470 L1175,470 L1196,770 L964,770 Z" fill="#0f7a5c"/>
    <path d="M1012,470 L1036,420 M1148,470 L1124,420" stroke="#0f7a5c" stroke-width="16" stroke-linecap="round"/>
    <rect x="1030" y="620" width="100" height="70" rx="12" fill="#0b6a50"/>
    <!-- 名札 -->
    <rect x="1074" y="494" width="124" height="50" rx="10" fill="#ffffff"/>
    <text x="1136" y="527" text-anchor="middle" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, sans-serif" font-size="21" font-weight="700" fill="#0f7a5c">登録販売者</text>
    <!-- 左腕（下ろす） -->
    <path d="M958,486 Q925,560 930,660" stroke="#dcecf8" stroke-width="54" stroke-linecap="round" fill="none"/>
    <circle cx="931" cy="676" r="24" fill="#f3cfb4"/>
    <!-- 右腕（胸の前でガッツポーズ） -->
    <path d="M1202,486 Q1250,560 1210,610" stroke="#dcecf8" stroke-width="54" stroke-linecap="round" fill="none"/>
    <circle cx="1196" cy="606" r="25" fill="#f3cfb4"/>
    <!-- 顔 -->
    <ellipse cx="1080" cy="312" rx="84" ry="94" fill="#f6d6bf"/>
    <!-- 前髪 -->
    <path d="M995,305 Q1000,212 1080,208 Q1160,212 1165,305 Q1135,252 1080,258 Q1025,252 995,305 Z" fill="#2e2622"/>
    <path d="M995,305 Q992,350 1004,382 Q990,340 998,300 Z" fill="#2e2622"/>
    <path d="M1165,305 Q1168,350 1156,382 Q1170,340 1162,300 Z" fill="#2e2622"/>
    <!-- 目・頬・口 -->
    <ellipse cx="1050" cy="322" rx="7" ry="10" fill="#2e2622"/>
    <ellipse cx="1110" cy="322" rx="7" ry="10" fill="#2e2622"/>
    <circle cx="1030" cy="350" r="13" fill="#f4a6a0" opacity=".55"/>
    <circle cx="1130" cy="350" r="13" fill="#f4a6a0" opacity=".55"/>
    <path d="M1062,358 Q1080,376 1098,358" stroke="#8a4b3a" stroke-width="5" fill="none" stroke-linecap="round"/>
  </g>

  <!-- 吹き出し -->
  <g>
    <rect x="1230" y="300" width="270" height="92" rx="46" fill="#ffffff" stroke="#f08a3c" stroke-width="5"/>
    <path d="M1250,372 L1222,410 L1282,384 Z" fill="#ffffff" stroke="#f08a3c" stroke-width="5" stroke-linejoin="round"/>
    <path d="M1252,368 L1278,382" stroke="#ffffff" stroke-width="8"/>
    <text x="1365" y="358" text-anchor="middle" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, sans-serif" font-size="30" font-weight="800" fill="#a8541c">ご相談ください</text>
  </g>

  <!-- きらめき -->
  <g fill="#f08a3c">
    <path d="M1240,170 l8,22 l22,8 l-22,8 l-8,22 l-8,-22 l-22,-8 l22,-8 Z"/>
    <path d="M930,230 l5,14 l14,5 l-14,5 l-5,14 l-5,-14 l-14,-5 l14,-5 Z" opacity=".7"/>
  </g>
</svg>
